<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Company information | Pump Bar</title>
  <meta name="description" content="Company information for Pump Bar Limited, registered in England and Wales." />
  <meta name="robots" content="index,follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Company information | Pump Bar" />
  <meta property="og:description" content="Company information for Pump Bar Limited." />
  <meta property="og:site_name" content="Pump Bar" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Company information | Pump Bar" />
  <meta name="twitter:description" content="Company information for Pump Bar Limited." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --black: #050505;
      --white: #f5f5f0;
      --grey: #b7b7b7;
      --muted: #8a8a8a;
      --pink: #ff2f86;
      --pink-glow: rgba(255, 47, 134, 0.32);
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse 70% 55% at 78% 8%, rgba(255, 47, 134, 0.18), transparent 55%),
        radial-gradient(ellipse 55% 45% at 8% 92%, rgba(255, 47, 134, 0.09), transparent 50%),
        linear-gradient(165deg, #08080a 0%, var(--black) 45%, #070709 100%);
      line-height: 1.55;
    }

    .noise {
      position: fixed;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(28px, 5vw, 48px) clamp(24px, 6vw, 72px) 36px;
    }

    .brand {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .brand a {
      color: inherit;
      text-decoration: none;
    }

    .brand span {
      color: var(--pink);
      text-shadow: 0 0 28px var(--pink-glow);
    }

    .content {
      flex: 1;
      max-width: 640px;
      padding: clamp(40px, 8vh, 72px) 0 48px;
    }

    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(42px, 7vw, 72px);
      line-height: 0.95;
      letter-spacing: 0.02em;
      margin-top: 28px;
      margin-bottom: 28px;
    }

    .company-block {
      color: var(--grey);
      font-size: clamp(16px, 2.1vw, 18px);
      font-weight: 500;
      line-height: 1.7;
    }

    .company-block p {
      margin-bottom: 6px;
    }

    .company-block a {
      color: var(--white);
      text-underline-offset: 2px;
    }

    .company-block a:hover {
      color: var(--pink);
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    footer a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    footer a:hover {
      color: var(--white);
    }
  </style>
</head>

<body>
  <div class="noise" aria-hidden="true"></div>

  <div class="page">
    <header>
      <p class="brand" aria-label="Pump Bar">
        <a href="/">PUMP <span>BAR</span></a>
      </p>
    </header>

    <main class="content">
      <h1>COMPANY INFORMATION</h1>
      <div class="company-block">
        <p>Pump Bar Limited</p>
        <p>Registered in England and Wales</p>
        <p>Company number: 16791402</p>
        <p>Registered office: The Old Rectory, Church Lane, Gamston, Retford, England, DN22 0QB</p>
        <p>Contact: <a href="mailto:info@pumpbar.uk">info@pumpbar.uk</a></p>
      </div>
    </main>

    <footer>
      <p>© 2026 Pump Bar Limited</p>
      <p>
        <a href="/">Waiting list</a>
        ·
        <a href="/privacy.html">Privacy notice</a>
        ·
        <a href="mailto:info@pumpbar.uk">info@pumpbar.uk</a>
      </p>
    </footer>
  </div>
</body>
</html>
